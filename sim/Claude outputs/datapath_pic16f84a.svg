<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="Arial, Helvetica, sans-serif" font-size="12" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<marker id="aB" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#1d5fd1"/></marker>
<marker id="aO" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#d9731a"/></marker>
<marker id="aG" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#2a9a4a"/></marker>
<marker id="aP" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#7b3fb5"/></marker>
<marker id="aK" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#444"/></marker>
</defs>
<rect width="960" height="620" fill="#ffffff"/>
<text x="20" y="22" font-size="16" font-weight="bold">Data path PIC16F84A (modelo en Verilog)</text>

<!-- leyenda -->
<g font-size="11">
<line x1="640" y1="14" x2="670" y2="14" stroke="#1d5fd1" stroke-width="2.5"/><text x="675" y="18">wdata (escribir)</text>
<line x1="760" y1="14" x2="790" y2="14" stroke="#d9731a" stroke-width="2.5"/><text x="795" y="18">rdata (leer)</text>
<line x1="640" y1="32" x2="670" y2="32" stroke="#2a9a4a" stroke-width="2"/><text x="675" y="36">we (habilitar)</text>
<line x1="760" y1="32" x2="790" y2="32" stroke="#7b3fb5" stroke-width="2"/><text x="795" y="36">direccion</text>
</g>

<!-- mem -->
<rect x="20" y="40" width="100" height="50" fill="#eef2f7" stroke="#333" stroke-width="1.5"/>
<text x="70" y="62" text-anchor="middle" font-weight="bold">mem</text>
<text x="70" y="78" text-anchor="middle" font-size="11">(ROM)</text>
<!-- instruction bus -->
<line x1="120" y1="65" x2="750" y2="65" stroke="#444" stroke-width="2.5"/>
<text x="130" y="58" font-size="11">instruction [13:0]</text>

<!-- decoder -->
<line x1="245" y1="65" x2="245" y2="100" stroke="#444" stroke-width="2" marker-end="url(#aK)"/>
<rect x="180" y="100" width="130" height="38" fill="#f6f1e1" stroke="#333" stroke-width="1.5"/>
<text x="245" y="116" text-anchor="middle" font-weight="bold">decoder</text>
<text x="245" y="130" text-anchor="middle" font-size="10">w_we, jump, flags_we, sel...</text>

<!-- addr mux -->
<line x1="150" y1="65" x2="150" y2="190" stroke="#7b3fb5" stroke-width="2"/>
<line x1="150" y1="190" x2="190" y2="190" stroke="#7b3fb5" stroke-width="2" marker-end="url(#aP)"/>
<text x="20" y="165" font-size="11">{RP0, f[6:0]}</text>
<text x="20" y="178" font-size="11">(8 bits)</text>
<rect x="190" y="170" width="120" height="60" fill="#efe6f8" stroke="#333" stroke-width="1.5"/>
<text x="250" y="195" text-anchor="middle" font-weight="bold">Addr Mux</text>
<text x="250" y="212" text-anchor="middle" font-size="10">f==0 ? FSR : {RP0,f}</text>
<line x1="310" y1="200" x2="400" y2="200" stroke="#7b3fb5" stroke-width="2.5" marker-end="url(#aP)"/>
<text x="318" y="193" font-size="11" fill="#7b3fb5">ram_addr [7:0]</text>

<!-- addr decoder -->
<rect x="400" y="95" width="160" height="50" fill="#e6f4ea" stroke="#333" stroke-width="1.5"/>
<text x="480" y="115" text-anchor="middle" font-weight="bold">decodificador de</text>
<text x="480" y="130" text-anchor="middle" font-weight="bold">direccion</text>
<line x1="355" y1="200" x2="355" y2="120" stroke="#7b3fb5" stroke-width="2"/>
<line x1="355" y1="120" x2="400" y2="120" stroke="#7b3fb5" stroke-width="2" marker-end="url(#aP)"/>

<!-- we bus -->
<line x1="400" y1="135" x2="385" y2="135" stroke="#2a9a4a" stroke-width="2"/>
<line x1="385" y1="135" x2="385" y2="440" stroke="#2a9a4a" stroke-width="2"/>
<text x="378" y="455" font-size="11" fill="#2a9a4a" text-anchor="middle">we_x</text>

<!-- modules -->
<g stroke="#333" stroke-width="1.5">
<rect x="410" y="250" width="150" height="50" fill="#e8f0fc"/>
<rect x="410" y="320" width="150" height="55" fill="#e8f0fc"/>
<rect x="410" y="395" width="150" height="40" fill="#e8f0fc"/>
<rect x="410" y="455" width="150" height="40" fill="#e8f0fc"/>
</g>
<text x="485" y="270" text-anchor="middle" font-weight="bold">RAM (GPR 68x8)</text>
<text x="485" y="287" text-anchor="middle" font-size="10">0x0C-0x4F</text>
<text x="485" y="340" text-anchor="middle" font-weight="bold">gpio: PORTB / TRISB</text>
<text x="485" y="357" text-anchor="middle" font-size="10">0x06 / 0x86 -> pines</text>
<text x="485" y="419" text-anchor="middle" font-weight="bold">STATUS</text>
<text x="485" y="479" text-anchor="middle" font-weight="bold">FSR</text>

<!-- wdata -->
<line x1="360" y1="545" x2="360" y2="270" stroke="#1d5fd1" stroke-width="3"/>
<line x1="360" y1="270" x2="410" y2="270" stroke="#1d5fd1" stroke-width="2.5" marker-end="url(#aB)"/>
<line x1="360" y1="347" x2="410" y2="347" stroke="#1d5fd1" stroke-width="2.5" marker-end="url(#aB)"/>
<line x1="360" y1="415" x2="410" y2="415" stroke="#1d5fd1" stroke-width="2.5" marker-end="url(#aB)"/>
<line x1="360" y1="475" x2="410" y2="475" stroke="#1d5fd1" stroke-width="2.5" marker-end="url(#aB)"/>
<text x="352" y="262" font-size="11" fill="#1d5fd1" text-anchor="end">data_in</text>
<!-- we ticks -->
<line x1="385" y1="285" x2="410" y2="285" stroke="#2a9a4a" stroke-width="2" marker-end="url(#aG)"/>
<line x1="385" y1="362" x2="410" y2="362" stroke="#2a9a4a" stroke-width="2" marker-end="url(#aG)"/>
<line x1="385" y1="428" x2="410" y2="428" stroke="#2a9a4a" stroke-width="2" marker-end="url(#aG)"/>
<line x1="385" y1="488" x2="410" y2="488" stroke="#2a9a4a" stroke-width="2" marker-end="url(#aG)"/>

<!-- addr to ram (tag) -->
<line x1="355" y1="200" x2="355" y2="235" stroke="#7b3fb5" stroke-width="2"/>
<line x1="355" y1="235" x2="450" y2="235" stroke="#7b3fb5" stroke-width="2"/>
<line x1="450" y1="235" x2="450" y2="250" stroke="#7b3fb5" stroke-width="2" marker-end="url(#aP)"/>
<text x="458" y="245" font-size="10" fill="#7b3fb5">addr</text>

<!-- FSR feedback to addr mux -->
<path d="M 485 495 L 485 515 L 60 515 L 60 215 L 190 215" fill="none" stroke="#666" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#aK)"/>
<text x="68" y="508" font-size="11" fill="#555">FSR -> direccion indirecta (siempre conectado)</text>

<!-- outputs to read mux -->
<line x1="560" y1="275" x2="640" y2="275" stroke="#d9731a" stroke-width="2.5" marker-end="url(#aO)"/>
<text x="565" y="268" font-size="10" fill="#d9731a">ram_dout</text>
<line x1="560" y1="347" x2="640" y2="347" stroke="#d9731a" stroke-width="2.5" marker-end="url(#aO)"/>
<text x="565" y="340" font-size="10" fill="#d9731a">port_rd / tris_rd</text>
<line x1="560" y1="415" x2="640" y2="415" stroke="#d9731a" stroke-width="2.5" marker-end="url(#aO)"/>
<text x="565" y="408" font-size="10" fill="#d9731a">status_out</text>
<line x1="560" y1="475" x2="640" y2="475" stroke="#d9731a" stroke-width="2.5" marker-end="url(#aO)"/>
<text x="565" y="468" font-size="10" fill="#d9731a">fsr_out</text>

<!-- read mux -->
<rect x="640" y="250" width="60" height="245" fill="#fdeedd" stroke="#333" stroke-width="1.5"/>
<text x="670" y="360" text-anchor="middle" font-weight="bold">MUX</text>
<text x="670" y="376" text-anchor="middle" font-weight="bold">lectura</text>
<text x="670" y="392" text-anchor="middle" font-size="10">sel =</text>
<text x="670" y="405" text-anchor="middle" font-size="10">ram_addr</text>

<!-- rdata -->
<line x1="700" y1="360" x2="730" y2="360" stroke="#d9731a" stroke-width="3" marker-end="url(#aO)"/>
<text x="702" y="352" font-size="11" fill="#d9731a">rdata</text>

<!-- mux B -->
<rect x="730" y="330" width="40" height="70" fill="#eef2f7" stroke="#333" stroke-width="1.5"/>
<text x="750" y="362" text-anchor="middle" font-weight="bold" font-size="11">mux</text>
<text x="750" y="376" text-anchor="middle" font-weight="bold" font-size="11">B</text>
<line x1="750" y1="65" x2="750" y2="330" stroke="#444" stroke-width="2" marker-end="url(#aK)"/>
<text x="758" y="200" font-size="11">k = instruction[7:0]</text>
<text x="758" y="214" font-size="10">(literal: MOVLW, ADDLW...)</text>

<!-- ALU -->
<line x1="770" y1="365" x2="800" y2="365" stroke="#333" stroke-width="2.5" marker-end="url(#aK)"/>
<text x="773" y="357" font-size="10">b</text>
<rect x="800" y="320" width="100" height="90" fill="#fff4cc" stroke="#333" stroke-width="1.5"/>
<text x="850" y="358" text-anchor="middle" font-weight="bold">ALU</text>
<text x="850" y="375" text-anchor="middle" font-size="10">+ - and or xor</text>
<text x="850" y="390" text-anchor="middle" font-size="10">Z, C, DC</text>

<!-- flags to STATUS -->
<path d="M 900 340 L 930 340 L 930 600 L 300 600 L 300 425 L 410 425" fill="none" stroke="#999" stroke-width="1.5" stroke-dasharray="3,3"/>
<text x="304" y="592" font-size="10" fill="#777">flags Z/C/DC -> STATUS (con su flag_we)</text>

<!-- W -->
<rect x="410" y="530" width="150" height="50" fill="#fde8e8" stroke="#333" stroke-width="1.5"/>
<text x="485" y="552" text-anchor="middle" font-weight="bold">W (working)</text>
<text x="485" y="568" text-anchor="middle" font-size="10">w_we</text>
<line x1="410" y1="545" x2="360" y2="545" stroke="#1d5fd1" stroke-width="3"/>
<text x="365" y="538" font-size="11" fill="#1d5fd1">wdata</text>
<!-- W -> ALU a -->
<path d="M 560 545 L 820 545 L 820 410" fill="none" stroke="#333" stroke-width="2.5" marker-end="url(#aK)"/>
<text x="600" y="540" font-size="10">a (W)</text>
<!-- ALU -> W -->
<path d="M 880 410 L 880 565 L 560 565" fill="none" stroke="#333" stroke-width="2.5" marker-end="url(#aK)"/>
<text x="600" y="577" font-size="10">c (resultado -> W)</text>
<!-- decoder to W tag -->
<text x="445" y="598" font-size="10" fill="#2a9a4a">(w_we viene del decoder)</text>
</svg>
